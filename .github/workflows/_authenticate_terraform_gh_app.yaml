name: _authenticate_terraform_gh_app

on:
  workflow_call:
    secrets:
      AVNETGIS_TF_GHE_APP_KEY:
        required: true
    outputs:
      app-token:
        value: ${{ jobs.authenticate_to_app.outputs.app-token }}

jobs:
  authenticate_to_app:
    runs-on: ubuntu-latest
    outputs:
      app-token: ${{ steps.app-token.outputs.token }}

    steps:
      - name: Get Application Token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ vars.AVNETGIS_TF_GHE_APP_ID }} # Org level Variables
          private-key: ${{ secrets.AVNETGIS_TF_GHE_APP_KEY }}
          owner: Andrew-s-Org-Testing
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global url."https://actions:${{ steps.app-token.outputs.token }}@github.com".insteadOf https://github.com
          git config --global url."https://actions:${{ steps.app-token.outputs.token }}@github.com/".insteadOf ssh://git@github.com/
