name: _authenticate_terraform_gh_app

on:
  workflow_call:
    secrets:
      AVNETGIS_TF_GHE_APP_KEY:
        required: true

jobs:
  authenticate_to_app:
    runs-on: [self-hosted, Linux, x64]
    steps:
      - name: Get Application Token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ vars.AVNETGIS_TF_GHE_APP_ID }} # Org level Variables
          private-key: ${{ secrets.AVNETGIS_TF_GHE_APP_KEY }}
          owner: AvnetGIS
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global url."https://${{ steps.app-token.outputs.app-slug }}:${{ steps.app-token.outputs.token }}@github.com".instedOf https://github.com
          git config --global url."https://:${{ steps.app-token.outputs.app-slug }}@github.com/".instedOf ssh://git@github.com
